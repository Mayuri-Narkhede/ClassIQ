<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ClassIQ - Courses</title>


    <!-- Common CSS -->
    <link
        rel="stylesheet"
        href="../../css/common.css"
    >

    <!-- Courses CSS -->
    <link
        rel="stylesheet"
        href="./courses.css"
    >

</head>


<body>

    <!-- =================================================
         NAVBAR
    ================================================== -->

    <div id="navbar"></div>


    <!-- =================================================
         COURSES PAGE
    ================================================== -->

    <main class="courses-page">

        <section class="courses-section">

            <!-- Page Heading -->

            <div class="courses-heading">

                <h1>
                    All Courses
                </h1>

                <span class="heading-arrow">
                    ↪
                </span>

            </div>


            <!-- =================================================
                 COURSE GRID
            ================================================== -->

            <div class="courses-grid">


                <!-- =================================================
                     COURSE 1 - FULL STACK WEB DEVELOPMENT
                ================================================== -->

                <article class="course-card">

                    <div class="course-image-wrapper">

                        <img
                            src="../../assets/images/course-web-development.png"
                            alt="Full Stack Web Development"
                            class="course-image"
                        >

                        <!-- Number badge -->

                        <span class="course-count">
                            3
                        </span>

                    </div>


                    <div class="course-card-content">

                        <h2>
                            Full Stack Web Development
                        </h2>

                        <p>
                            Learn to build a full stack web
                            application from scratch
                        </p>


                        <div class="course-card-bottom">

                            <span class="course-price">
                                $100
                            </span>

                            <a
                                href="#"
                                class="enroll-button"
                            >
                                Enroll
                            </a>

                        </div>

                    </div>

                </article>


                <!-- =================================================
                     COURSE 2 - DATA SCIENCE
                ================================================== -->

                <article class="course-card">

                    <div class="course-image-wrapper">

                        <img
                            src="../../assets/images/course-data-science.png"
                            alt="Data Science"
                            class="course-image"
                        >

                        <span class="course-count">
                            3
                        </span>

                    </div>


                    <div class="course-card-content">

                        <h2>
                            Data Science
                        </h2>

                        <p>
                            Learn to analyze data and build
                            predictive models
                        </p>


                        <div class="course-card-bottom">

                            <span class="course-price">
                                $400
                            </span>

                            <a
                                href="#"
                                class="enroll-button"
                            >
                                Enroll
                            </a>

                        </div>

                    </div>

                </article>


                <!-- =================================================
                     COURSE 3 - UI/UX DESIGN
                ================================================== -->

                <article class="course-card">

                    <div class="course-image-wrapper">

                        <img
                            src="../../assets/images/course-uiux.png"
                            alt="UI/UX Design"
                            class="course-image"
                        >

                        <span class="course-count">
                            3
                        </span>

                    </div>


                    <div class="course-card-content">

                        <h2>
                            UI/UX Design
                        </h2>

                        <p>
                            Learn to design beautiful user interfaces
                        </p>


                        <div class="course-card-bottom">

                            <span class="course-price">
                                $800
                            </span>

                            <a
                                href="#"
                                class="enroll-button"
                            >
                                Enroll
                            </a>

                        </div>

                    </div>

                </article>


            </div>

        </section>

    </main>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <div id="footer"></div>


    <!-- Common JavaScript -->

    <script src="../../js/common.js"></script>

</body>

</html>
