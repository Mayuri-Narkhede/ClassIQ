<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ClassIQ - Login</title>


    <!-- Common CSS -->
    <link
        rel="stylesheet"
        href="../../css/common.css"
    >

    <!-- Login CSS -->
    <link
        rel="stylesheet"
        href="./signin.css"
    >

</head>


<body>

    <!-- =================================================
         NAVBAR
    ================================================== -->

    <div id="navbar"></div>


    <!-- =================================================
         LOGIN PAGE
    ================================================== -->

    <main class="login-page">

        <div class="login-card">
    
            <h1>Login</h1>
    
            <form class="login-form" id="loginForm">
    
                <!-- Email -->
    
                <div class="form-group">
    
                    <label for="email">
                        Email
                    </label>
    
                    <div class="input-error-wrapper">
    
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                        >
    
                        <span
                            class="error-icon"
                            title="Please fill out this field"
                        >
                            !
                        </span>
    
                    </div>
    
                </div>
    
    
                <!-- Password -->
    
                <div class="form-group">
    
                    <label for="password">
                        Password
                    </label>
    
                    <div class="password-wrapper">
    
                        <div class="input-error-wrapper">
    
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                            >
    
                            <span
                                class="error-icon"
                                title="Please fill out this field"
                            >
                                !
                            </span>
    
                        </div>
    
                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                        >
                            👁
                        </button>
    
                    </div>
    
                </div>
    
    
                <!-- Login -->
    
                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>
    
    
                <!-- Signup -->
    
                <p class="signup-text">
    
                    Don't have an account?
    
                    <a href="SignUp.html">
                        Sign Up
                    </a>
    
                </p>
    
            </form>
    
        </div>
    
    </main>

    <div id="footer"></div>


    <!-- Common JavaScript -->

    <script src="../../js/common.js"></script>
    <script src="signin.js"></script>

</body>

</html>
