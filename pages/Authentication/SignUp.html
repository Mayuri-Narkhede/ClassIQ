<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SignUp - ClassIQ</title>

    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="./signup.css">
</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>


    <!-- Signup Section -->
    <main class="signup-page">

        <div class="signup-card">

            <h1>SignUp</h1>

            <form id="signupForm" novalidate>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                    <div class="error-tooltip">
                        <span class="icon-box">!</span>
                        <span class="error-text">Please fill out this field.</span>
                    </div>
                </div>


                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                    >

                    <div class="error-tooltip">
                        <span class="icon-box">!</span>
                        <span class="error-text">Please fill out this field.</span>
                    </div>
                </div>


                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper" style="position: relative; display: flex; align-items: center;">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password" 
                            required 
                            style="width: 100%; padding-right: 40px;"
                        />
                        <span 
                            class="password-toggle" 
                            style="position: absolute; right: 12px; cursor: pointer; user-select: none;"
                            aria-label="Show password"
                        >👁</span>
                    </div>
                    <small class="error-text"></small>
                </div>


                <!-- Signup Button -->
                <button type="submit" class="signup-button">
                    Sign Up
                </button>

            </form>


            <!-- Login -->
            <p class="login-text">
                Already have an account?
                <a href="../Authentication/Signin.html">Login</a>
            </p>

        </div>

        <!-- Toast Container -->
        <div id="toast" class="toast"></div>

    </main>


    <!-- Footer -->
    <div id="footer"></div>

    <script src="../../js/common.js"></script>
    <script src="signup.js"></script>
    
</body>
</html>
